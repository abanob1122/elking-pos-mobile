<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Crown (King / الكينج) -->
  <path d="M 156 220 L 190 280 L 256 180 L 322 280 L 356 220 L 376 310 L 136 310 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Jewels on Crown Points -->
  <circle cx="156" cy="214" r="10" fill="#fef3c7"/>
  <circle cx="256" cy="174" r="14" fill="#fef3c7"/>
  <circle cx="356" cy="214" r="10" fill="#fef3c7"/>

  <!-- Base Crown Band -->
  <rect x="136" y="318" width="240" height="20" rx="8" fill="url(#goldGrad)"/>

  <!-- Subtle POS register shape under crown -->
  <rect x="166" y="348" width="180" height="42" rx="10" fill="url(#blueGrad)" opacity="0.9"/>
  <line x1="190" y1="369" x2="322" y2="369" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>

  <!-- Arabic Text: ELKing POS -->
  <text x="256" y="430" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    ELKing POS
  </text>
  <text x="256" y="465" font-family="'Cairo', 'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="600" fill="#fbbf24" text-anchor="middle">
    تطبيق صاحب المحل
  </text>
</svg>
